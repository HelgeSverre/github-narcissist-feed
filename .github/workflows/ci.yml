name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: narcissist-feed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
